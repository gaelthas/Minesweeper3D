          <input id="side" type="range" min="3" max="11" step="1" value="5" />
          <output id="side-value">5</output>
        </div>
        <div class="row">
          <label for="mines">雷数</label>
          <input id="mines" type="range" min="1" max="100" step="1" value="38" />
          <output id="mines-value">38</output>
        </div>
        <p class="hint-line" id="board-hint"></p>

        <div class="actions">
          <button id="board-cancel" type="button">取消</button>
          <button id="board-start" type="button" class="primary">开始</button>
        </div>
      </div>
    </div>

    <div id="options-panel" class="overlay" hidden>
      <div class="panel">
        <h2>选项</h2>
        <p class="sub">改动即时生效，自动保存</p>

        <div class="row">
          <label for="volume">音量</label>
          <input id="volume" type="range" min="0" max="100" step="1" value="70" />
          <output id="volume-value">70</output>
        </div>
        <div class="row">
          <label>静音</label>
          <button id="mute" type="button" class="toggle">静音</button>
        </div>
        <div class="row">
          <label>帧率</label>
          <button id="show-fps" type="button" class="toggle">显示帧率</button>
        </div>

        <div class="row">
          <label for="map-left">左键</label>
          <select id="map-left"></select>
        </div>
        <div class="row">
          <label for="map-middle">中键</label>
          <select id="map-middle"></select>
        </div>
        <div class="row">
          <label for="map-right">右键</label>
          <select id="map-right"></select>
        </div>

        <div class="actions">
          <span class="version" id="version"></span>
          <button id="options-close" type="button" class="primary">关闭</button>
        </div>
      </div>
    </div>

    <div id="result" class="overlay" hidden>
      <div class="panel narrow">
        <h2 id="result-title">清空</h2>
        <p class="big" id="result-time">00:00</p>
        <p class="sub" id="result-detail"></p>
        <div class="actions">
          <button id="result-close" type="button">关闭</button>
          <button id="result-again" type="button" class="primary">再来一局</button>
        </div>
      </div>
    </div>

  </body>
</html>
