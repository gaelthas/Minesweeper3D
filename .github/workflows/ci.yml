name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: 逻辑层测试
        run: npm test
      - name: 构建单文件
        run: npm run build
      - name: 入库产物是否与源码同步
        run: |
          if ! git -C "$GITHUB_WORKSPACE" diff --quiet -- web/dist/index.html; then
            echo "::error::web/dist/index.html 与源码不同步，先在本地 npm run build 再提交"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: minecube3d-html
          path: web/dist/index.html
          if-no-files-found: error
